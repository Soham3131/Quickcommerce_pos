    function formatMoney(amount) {
      const num = Number(amount) || 0;
      const rate = state.currency && state.currency.rate !== undefined ? state.currency.rate : 1;
      const decimals = state.currency ? state.currency.decimalPlaces : 2;
      const converted = (num * rate).toFixed(decimals);
      if (state.currency && state.currency.position === 'after') {
        return `${converted} ${state.currency.symbol}`;
      }
      return `${(state.currency ? state.currency.symbol : '₹')}${converted}`;
    }

    function setStoreCurrency(currCode) {
      const found = CURRENCIES.find(c => c.code === currCode);
      if (found) {

        try {

        } catch (e) {}
        showToast(`Store currency set to ${found.name}`);
        render();

    }
    const setCurrency = setStoreCurrency;

    function showToast(msg, type = 'success') {

    // ==========================================
    // AUTHORITATIVE STOREFRONT COUPON ENGINE
    // ==========================================
    function validateCoupon(rawCode, subtotal, fulfillment) {
      if (!rawCode) return { isValid: false, discount: 0, isFreeShipping: false, message: '' };
      const code = rawCode.trim().toUpperCase();
      const isTakeaway = fulfillment === 'takeaway';
      const isThresholdFree = isTakeaway || subtotal >= state.freeDeliveryThreshold;

      if (code === 'WELCOME50') {
        if (subtotal < 300) {
          return {
            isValid: false,
            discount: 0,
            isFreeShipping: false,
            message: `Minimum order for WELCOME50 is ${state.currency.symbol}300. Add items to qualify.`
          };
        }
        const discount = Math.round(subtotal * 0.10);
        return {
          isValid: true,
          discount,
          isFreeShipping: false,
          message: `Coupon WELCOME50 applied! Saved ${formatMoney(discount)}.`
        };
      }

      if (code === 'FREESHIP') {
        return {
          isValid: true,
          discount: 0,
          isFreeShipping: true,
          message: `Coupon FREESHIP applied! Free express delivery unlocked.`
        };
      }

      if (code === 'AVANI15') {
        if (subtotal < 1000) {
          return {
            isValid: false,
            discount: 0,
            isFreeShipping: false,
            message: `Minimum order for AVANI15 is ${state.currency.symbol}1000. Add items to qualify.`
          };
        }
        const discount = Math.round(subtotal * 0.15);
        return {
          isValid: true,
          discount,
          isFreeShipping: false,
          message: `Coupon AVANI15 applied! Saved ${formatMoney(discount)}.`
        };
      }

      return {
        isValid: false,
        discount: 0,
        isFreeShipping: false,
        message: `Coupon code "${code}" is not valid.`
      };
    }

    // ==========================================
    // STOREFRONT ACTIONS
    // ==========================================
    function addToCustomerCart(product, qty = 1) {
      const existing = state.customerCart.find(ci => ci.product.id === product.id);
      if (existing) {
        if (existing.quantity + qty > product.stock) {
          showToast(`Cannot add more than available stock (${product.stock} ${product.unit})`, 'error');
          return;
        }
        existing.quantity = Math.round((existing.quantity + qty) * 100) / 100;
      } else {
        if (product.stock <= 0) {
          showToast(`"${product.name}" is OUT OF STOCK!`, 'error');
          return;
        }
        state.customerCart.push({ product, quantity: qty });
      }
      showToast(`Added ${qty} ${product.unit} of ${product.name} to cart`);
      render();
    }

    function updateCustomerCartQty(productId, delta) {
      const item = state.customerCart.find(i => i.product.id === productId);
      if (!item) return;
      const step = item.product.isWeighed ? 0.25 : 1;
      const newQty = Math.round((item.quantity + delta) * 100) / 100;
      if (newQty <= 0) {
        state.customerCart = state.customerCart.filter(i => i.product.id !== productId);
        showToast(`Removed from cart`);
      } else if (newQty > item.product.stock) {
        showToast(`Max available stock is ${item.product.stock} ${item.product.unit}`, 'error');
      } else {
        item.quantity = newQty;
      }
      render();
    }

    function toggleWishlist(productId) {
      if (state.wishlist.includes(productId)) {
        state.wishlist = state.wishlist.filter(id => id !== productId);
        showToast(`Removed from saved wishlist`);
      } else {
        state.wishlist.push(productId);
        showToast(`Saved to your grocery wishlist`);
      }
      render();
    }

    function placeCustomerOrder() {
      if (state.customerCart.length === 0) {
        showToast(`Your shopping cart is empty!`, 'error');
        return;
      }

      // Check stock validity
      for (const item of state.customerCart) {
        const prod = state.products.find(p => p.id === item.product.id);
        if (!prod || prod.stock < item.quantity) {
          showToast(`Stock changed! "${item.product.name}" is no longer sufficient.`, 'error');
          return;
        }
      }

      // Subtotal calculation
      const subtotal = state.customerCart.reduce((sum, ci) => sum + ci.product.price * ci.quantity, 0);
      const isThresholdFree = state.checkoutData.fulfillment === 'takeaway' || subtotal >= state.freeDeliveryThreshold;
      const cVal = validateCoupon(state.checkoutData.coupon, subtotal, state.checkoutData.fulfillment);
      
      const isFreeDelivery = isThresholdFree || (cVal.isValid && cVal.isFreeShipping);
      const delCharge = isFreeDelivery ? 0 : state.deliveryCharge;
      const discount = cVal.isValid ? cVal.discount : 0;
      const validAppliedCoupon = cVal.isValid ? state.checkoutData.coupon : null;

      const taxAmount = Math.round((subtotal * (state.gstRate / 100)) * 100) / 100;
      const grandTotal = Math.round((Math.max(0, subtotal - discount) + taxAmount + delCharge) * 100) / 100;

      const orderNumber = 'AVN-ORD-' + Math.floor(100000 + Math.random() * 900000);
      const invNumber = 'AVN-INV-' + (1044 + state.orders.length + 1);

      const activeAddr = state.customerAddresses.find(a => a.id === state.selectedAddressId) || state.customerAddresses[0];
      const addressString = state.checkoutData.fulfillment === 'takeaway' 
        ? 'Store Pickup — Avani Grocers Supermarket Flagship, Sector 65 Gurugram'
        : `${activeAddr.houseNo}, ${activeAddr.street}, ${activeAddr.area}, ${activeAddr.city} — ${activeAddr.pincode}`;

      const newOrder = {
        id: orderNumber,
        invoiceNumber: invNumber,
        orderType: state.checkoutData.fulfillment,
        status: 'pending',
        paymentStatus: 'paid',
        paymentMethod: state.checkoutData.paymentMethod,
        customerId: state.user?.id || 'cust-demo-1',
        customerName: state.checkoutData.name,
        customerPhone: state.checkoutData.phone,
        customerAddress: addressString,
        deliverySlot: state.checkoutData.timeSlot,
        appliedCoupon: state.checkoutData.coupon,
        subtotal: Math.round(subtotal * 100) / 100,
        taxAmount,
        deliveryCharge: delCharge,
        grandTotal,
        createdAt: 'Just now',
        items: state.customerCart.map(ci => ({
          name: ci.product.name,
          qty: ci.quantity,
          price: ci.product.price,
          unit: ci.product.unit,
          total: Math.round(ci.product.price * ci.quantity * 100) / 100
        }))
      };

      // 1. Live stock reduction (Single Deduction Rule)
      state.products = state.products.map(p => {
        const inCart = state.customerCart.find(ci => ci.product.id === p.id);
        if (inCart) {
          return { ...p, stock: Math.max(0, Math.round((p.stock - inCart.quantity) * 100) / 100) };
        }
        return p;
      });

      // 2. Add to orders
      state.orders.unshift(newOrder);
      state.lastPlacedOrder = newOrder;

      // 3. Clear customer cart
      state.customerCart = [];

      // 4. Navigate to confirmation
      state.storefrontPage = 'confirmation';
      showToast(`Order #${invNumber} placed successfully! Stock deducted store-wide.`);
      render();
    }

    function cancelOrder(orderId) {
      const ord = state.orders.find(o => o.id === orderId);
      if (!ord || ord.status === 'cancelled' || ord.status === 'refunded') return;

      if (!confirm(`Cancel order ${ord.invoiceNumber} and restore all deducted stock to inventory?`)) return;

      // Stock reversal
      state.products = state.products.map(p => {
        const item = ord.items.find(i => i.name === p.name);
        if (item) {
          return { ...p, stock: Math.round((p.stock + item.qty) * 100) / 100 };
        }
        return p;
      });

      ord.status = 'cancelled';
      state.adjustments.unshift({
        id: 'adj-' + Date.now(),
        product: ord.items[0]?.name || 'Multiple Products',
        type: 'add',
        qty: ord.items.reduce((s, i) => s + i.qty, 0),
        reason: `Order Cancelled — Stock Restored (${ord.invoiceNumber})`,
        user: state.user?.name || 'Admin',
        time: 'Just now'
      });

      showToast(`Order ${ord.invoiceNumber} cancelled & stock restored to inventory.`);
      render();
    }

    function renderProductCard(p) {
      const inCart = state.customerCart.find(ci => ci.product.id === p.id);
      const isWishlisted = state.wishlist.includes(p.id);
      const discountPercent = p.mrp > p.price ? Math.round(((p.mrp - p.price) / p.mrp) * 100) : 0;

      return `
        <div class="group relative rounded-2xl border border-slate-200/90 bg-white p-2.5 sm:p-3 shadow-2xs hover:shadow-md hover:border-emerald-400 transition-all duration-200 flex flex-col justify-between h-full">
          <!-- Image Container -->
          <div class="relative w-full aspect-[4/3] rounded-xl bg-slate-50 overflow-hidden mb-2 shrink-0">
            <img
              src="${p.image}"
              alt="${p.name}"
              class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
              loading="lazy"
            />

            <!-- Badges -->
            <div class="absolute top-1.5 left-1.5 flex flex-col gap-1">
              ${discountPercent > 0 ? `
                <span class="rounded-md bg-rose-600 px-1.5 py-0.5 text-[9px] font-black text-white shadow-xs">
                  ${discountPercent}% OFF
                </span>
              ` : ''}
              ${p.isWeighed ? `
                <span class="rounded-md bg-emerald-800/90 backdrop-blur-xs px-1.5 py-0.5 text-[8px] font-black text-white">
                  By Weight (${p.unit})
                </span>
              ` : ''}
            </div>

            <!-- Wishlist Heart -->
            <button
              onclick="toggleWishlist('${p.id}');"
              class="absolute top-1.5 right-1.5 h-6 w-6 rounded-full bg-white/90 backdrop-blur-xs flex items-center justify-center text-slate-400 hover:text-rose-500 shadow-2xs transition"
            >
              <i data-lucide="heart" class="h-3.5 w-3.5 ${isWishlisted ? 'text-rose-500 fill-rose-500' : ''}"></i>
            </button>
          </div>

          <!-- Product Details -->
          <div class="space-y-1 mb-2 flex-1 flex flex-col justify-between">
            <div>
              <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400 block mb-0.5">
                ${p.category}
              </span>
              <h3 class="text-xs sm:text-[13px] font-bold text-slate-900 group-hover:text-emerald-700 transition line-clamp-2 h-8 leading-snug">
                ${p.name}
              </h3>
            </div>

            <div class="space-y-0.5 pt-0.5">
              <!-- Rating & Stock info -->
              <div class="flex items-center justify-between text-[10px]">
                <div class="flex items-center gap-1 font-bold text-amber-600">
                  <i data-lucide="star" class="h-3 w-3 fill-amber-400 text-amber-500"></i>
                  <span>${p.rating || 4.8}</span>
                  <span class="text-slate-400 text-[9px]">(${p.reviewCount || 42})</span>
                </div>
                <span class="text-[9px] font-bold ${p.stock <= 5 ? 'text-amber-600' : 'text-emerald-600'}">
                  ${p.stock <= 0 ? 'Out of Stock' : `${p.stock} ${p.unit} left`}
                </span>
              </div>

              <!-- Price Box -->
              <div class="flex items-baseline gap-1.5 pt-0.5">
                <span class="text-sm sm:text-base font-black text-slate-900 tabular-nums">
                  ${formatMoney(p.price)}
                </span>
                ${p.mrp > p.price ? `
                  <span class="text-[10px] text-slate-400 line-through tabular-nums">
                    ${formatMoney(p.mrp)}
                  </span>
                ` : ''}
                <span class="text-[10px] text-slate-400">/ ${p.unit}</span>
              </div>
            </div>
          </div>

          <!-- Action Button: Add or Stepper -->
          <div class="pt-1.5 border-t border-slate-100">
            ${inCart ? `
              <div class="flex items-center justify-between rounded-xl bg-emerald-50 border border-emerald-200 p-0.5">
                <button
                  onclick="updateCustomerCartQty('${p.id}', -${p.isWeighed ? 0.25 : 1});"
                  class="h-6 w-6 rounded-lg bg-white text-emerald-800 shadow-2xs font-black flex items-center justify-center hover:bg-emerald-600 hover:text-white transition text-xs"
                >
                  -
                </button>
                <span class="text-[11px] font-black text-emerald-950 tabular-nums">
                  ${inCart.quantity} ${p.unit}
                </span>
                <button
                  onclick="updateCustomerCartQty('${p.id}', ${p.isWeighed ? 0.25 : 1});"
                  class="h-6 w-6 rounded-lg bg-white text-emerald-800 shadow-2xs font-black flex items-center justify-center hover:bg-emerald-600 hover:text-white transition text-xs"
                >
                  +
                </button>
              </div>
            ` : `
              <button
                onclick="addToCustomerCart(state.products.find(x => x.id === '${p.id}'), ${p.isWeighed ? 0.5 : 1});"
                ${p.stock <= 0 ? 'disabled' : ''}
                class="w-full py-1.5 px-2.5 rounded-xl ${p.stock <= 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-2xs active:scale-95'} text-xs font-bold transition flex items-center justify-center gap-1"
              >
                <i data-lucide="plus" class="h-3 w-3"></i>
                <span>${p.stock <= 0 ? 'Out of Stock' : 'Add to Cart'}</span>
              </button>
            `}
          </div>
        </div>
      `;
    }

    // ==========================================
    // STOREFRONT PAGE: SHOP (CATALOG & SEARCH)

    function renderStorefrontShop() {
      let filtered = state.products.filter(p => p.status !== 'inactive' && p.published !== false);

      if (state.selectedCategory !== 'All') {
        filtered = filtered.filter(p => p.category === state.selectedCategory);
      }

      if (state.searchQuery.trim()) {
        const q = state.searchQuery.toLowerCase();
        filtered = filtered.filter(p =>
          p.name.toLowerCase().includes(q) ||
          p.category.toLowerCase().includes(q) ||
          p.sku.toLowerCase().includes(q)
        );
      }

      return `
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
          <!-- Catalog Header -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-5">
            <div>
              <div class="flex items-center gap-2">
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">
                  ${state.selectedCategory === 'All' ? 'All Grocery Products' : state.selectedCategory}
                </h1>
                <span class="rounded-full bg-emerald-100 text-emerald-800 px-2.5 py-0.5 text-xs font-black">
                  ${filtered.length} items
                </span>
              </div>
              <p class="text-xs text-slate-500 mt-1">
                ${state.searchQuery ? `Search results for "${state.searchQuery}"` : 'Browse fresh fruits, vegetables, dairy, staples, and household essentials.'}
              </p>
            </div>

            <div class="flex items-center gap-2">
              ${state.selectedCategory !== 'All' || state.searchQuery ? `
                <button
                  onclick="state.selectedCategory='All'; state.searchQuery=''; render();"
                  class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 transition"
                >
                  Clear Filters ✕
                </button>
              ` : ''}

              <select
                onchange="
                  if (this.value === 'price-asc') state.products.sort((a,b) => a.price - b.price);
                  else if (this.value === 'price-desc') state.products.sort((a,b) => b.price - a.price);
                  else state.products.sort((a,b) => (b.rating || 0) - (a.rating || 0));
                  render();
                "
                class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-bold text-slate-700"
              >
                <option value="featured">Sort by: Popularity</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
              </select>

          </div>

          <!-- Product Grid -->
          ${filtered.length === 0 ? `
            <div class="rounded-3xl border border-dashed border-slate-300 p-12 text-center bg-white space-y-3">

              <button onclick="state.selectedCategory='All'; state.searchQuery=''; render();" class="mt-2 inline-flex rounded-xl bg-emerald-600 px-4 py-2 text-xs font-bold text-white">
                Reset Catalog
              </button>
            </div>
          ` : `
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 gap-4">
              ${filtered.map(p => renderProductCard(p)).join('')}
            </div>
          `}
        </div>
      `;
    }

      const deliveryFee = isFreeDelivery ? 0 : state.deliveryCharge;

                ${state.customerCart.map(item => `
                  <div class="p-4 sm:p-5 flex items-center justify-between gap-4">

    // ==========================================

    function renderStorefrontCheckout() {
      const subtotal = state.customerCart.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
      const couponResult = state.checkoutData.coupon ? validateCoupon(state.checkoutData.coupon, subtotal, state.checkoutData.fulfillment) : null;
      const discount = (couponResult && couponResult.isValid) ? couponResult.discountAmount : 0;
      const isFreeDelivery = subtotal >= state.freeDeliveryThreshold || (couponResult && couponResult.isValid && couponResult.isFreeShipping);
      const delCharge = state.checkoutData.fulfillment === 'takeaway' ? 0 : (isFreeDelivery ? 0 : state.deliveryCharge);
      
      const taxableSubtotal = Math.max(0, subtotal - discount);
      const taxAmount = Math.round((taxableSubtotal * (state.gstRate / 100)) * 100) / 100;

      const activeOrder = state.activeTrackingOrder || state.orders[0];

      const stages = [

                <div class="sm:text-right">

    function setOrderStatus(orderId, newStatus) {
      const order = state.orders.find(o => o.id === orderId);
      if (!order) return;
      const prevStatus = order.status;
      order.status = newStatus;

      if (newStatus === 'cancelled' && prevStatus !== 'cancelled') {
        // Reverse stock deduction exactly once
        order.items.forEach(item => {
          const prod = state.products.find(p => p.name === item.name || p.id === item.productId);
          if (prod) {
            prod.stock = Math.round((prod.stock + (item.qty || 1)) * 100) / 100;
          }
        });
        state.adjustments.unshift({
          id: 'adj-' + Date.now(),
          product: order.items.map(i => i.name).join(', '),
          type: 'add',
          qty: order.items.reduce((s, i) => s + (i.qty || 1), 0),
          reason: `Order Cancelled (${order.invoiceNumber}) — Stock Restored`,
          user: state.user?.name || 'Admin',
          time: 'Just now'
        });
        showToast(`Order #${order.invoiceNumber} cancelled & inventory restored!`);
      } else {
        showToast(`Order #${order.invoiceNumber} status: ${newStatus.replace('_', ' ').toUpperCase()}`);
      }
      render();
    }

    function cancelOrder(orderId) {
      if (confirm('Cancel this order and restore its inventory back to stock?')) {

    }

    // Stock Adjustment Helpers
    function openStockAdjustModal(productId) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      state.adjustModalProduct = prod;
      state.showAdjustModal = true;
      render();

    function closeStockAdjustModal() {
      state.showAdjustModal = false;
      state.adjustModalProduct = null;
      render();
    }

    function handleStockAdjustSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const prod = state.adjustModalProduct;
      if (!prod) return;
      const type = form.type.value;
      const qty = parseFloat(form.quantity.value) || 0;
      const reason = form.reason.value.trim() || `${type.toUpperCase()} Stock Adjustment`;

      const prev = prod.stock;
      let next = prev;
      if (type === 'add') next = prev + qty;
      else if (type === 'damage' || type === 'expired') next = Math.max(0, prev - qty);
      else next = Math.max(0, qty); // correction

      prod.stock = Math.round(next * 100) / 100;
      state.adjustments.unshift({
        id: 'adj-' + Date.now(),
        product: prod.name,
        type,
        qty: Math.abs(next - prev),
        reason,
        user: state.user?.name || 'Admin',
        time: 'Just now'
      });
      showToast(`Stock adjusted for ${prod.name}: ${prev} → ${prod.stock} ${prod.unit}`);
      closeStockAdjustModal();
    }

    function quickRestock(productId, amount = 15) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      const prev = prod.stock;
      prod.stock = Math.round((prev + amount) * 100) / 100;
      state.adjustments.unshift({
        id: 'adj-' + Date.now(),
        product: prod.name,
        type: 'add',
        qty: amount,
        reason: `Quick Replenishment (+${amount})`,
        user: state.user?.name || 'Admin',
        time: 'Just now'
      });
      showToast(`Restocked +${amount} ${prod.unit} of "${prod.name}" (Now: ${prod.stock})`);
      render();
    }

    // POS Cart Helpers
    function addPosItem(productId, qty = 1) {
      const prod = state.products.find(p => p.id === productId);
      if (!prod) return;
      if (prod.stock <= 0) {
        showToast(`"${prod.name}" is OUT OF STOCK!`, 'error');
        return;
      }
      const existing = state.cart.find(ci => ci.product.id === productId);
      if (existing) {
        if (existing.quantity + qty > prod.stock) {
          showToast(`Cannot exceed available inventory (${prod.stock} ${prod.unit})`, 'error');
          return;
        }
        existing.quantity = Math.round((existing.quantity + qty) * 100) / 100;
      } else {
        state.cart.push({ product: prod, quantity: qty });
      }
      showToast(`Added ${prod.name} to POS bill`);
      render();
    }

    function updatePosQty(productId, deltaOrVal, isAbsolute = false) {
      const item = state.cart.find(ci => ci.product.id === productId);
      if (!item) return;
      let newQty = isAbsolute ? parseFloat(deltaOrVal) : (item.quantity + parseFloat(deltaOrVal));
      newQty = Math.round((newQty || 0) * 100) / 100;
      if (newQty <= 0) {
        state.cart = state.cart.filter(ci => ci.product.id !== productId);
        showToast(`Removed ${item.product.name} from bill`);
      } else if (newQty > item.product.stock) {
        item.quantity = item.product.stock;
        showToast(`Max available stock is ${item.product.stock} ${item.product.unit}`, 'error');
      } else {
        item.quantity = newQty;
      }
      render();
    }

    function removePosItem(productId) {
      const item = state.cart.find(ci => ci.product.id === productId);
      if (item) {
        state.cart = state.cart.filter(ci => ci.product.id !== productId);
        showToast(`Removed ${item.product.name}`);
        render();
      }
    }

    function clearPosCart() {
      state.cart = [];
      state.orderDiscount = 0;
      render();
    }

    function checkoutPOS() {
      if (state.cart.length === 0) {
        alert('Your bill is empty. Please add products to bill first.');
        return;
      }

      for (const ci of state.cart) {
        const p = state.products.find(x => x.id === ci.product.id);
        if (!p || p.stock < ci.quantity) {
          alert(`Insufficient inventory for "${ci.product.name}". Available: ${p ? p.stock : 0}`);
          return;
        }
      }

      const posSubtotal = state.cart.reduce((s, ci) => s + ci.product.price * ci.quantity, 0);
      const posTax = Math.round((posSubtotal * (state.gstRate / 100)) * 100) / 100;
      const posGrandTotal = Math.round((posSubtotal + posTax - state.orderDiscount) * 100) / 100;
      const inv = 'AVN-INV-' + (1044 + state.orders.length + 1);

      const ord = {
        id: 'ord-' + Date.now(),
        invoiceNumber: inv,
        orderType: 'in-store',
        status: 'completed',
        paymentStatus: 'paid',
        paymentMethod: state.paymentMethod || 'cash',
        customerName: state.posCustomerName || 'Walk-in Shopper',
        customerPhone: state.posCustomerPhone || '—',
        grandTotal: posGrandTotal,
        subtotal: posSubtotal,
        orderDiscount: state.orderDiscount,
        taxAmount: posTax,
        createdAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        items: state.cart.map(c => ({
          productId: c.product.id,
          name: c.product.name,
          sku: c.product.sku,
          unit: c.product.unit,
          qty: c.quantity,
          price: c.product.price,
          total: Math.round(c.product.price * c.quantity * 100) / 100
        }))
      };

      // Deduct stock exactly once
      state.cart.forEach(ci => {
        const prod = state.products.find(x => x.id === ci.product.id);
        if (prod) {
          const prev = prod.stock;
          prod.stock = Math.round(Math.max(0, prod.stock - ci.quantity) * 100) / 100;
          state.adjustments.unshift({
            id: 'adj-' + Date.now(),
            product: prod.name,
            type: 'remove',
            qty: ci.quantity,
            reason: `POS Counter Sale (${inv})`,
            user: state.user?.name || 'Cashier',
            time: 'Just now'
          });
        }
      });

      state.orders.unshift(ord);
      state.cart = [];
      state.orderDiscount = 0;
      state.activeInvoice = ord;
      state.invoiceTab = 'a4';
      state.showInvoiceModal = true;
      showToast(`POS bill #${inv} charged! Stock updated.`);
      render();
    }

    // ==========================================
    function renderAdminSidebar() {

    // ==========================================
    // MODULE 2: ORDERS & DISPATCH VIEW
    // ==========================================
    function renderOrdersView() {
      const activeFilter = state.ordersFilter || 'all';
      let filteredOrders = state.orders;
      if (activeFilter === 'delivery') filteredOrders = state.orders.filter(o => o.orderType === 'delivery');
      else if (activeFilter === 'in-store') filteredOrders = state.orders.filter(o => o.orderType === 'in-store');
      else if (activeFilter === 'out_for_delivery') filteredOrders = state.orders.filter(o => o.status === 'out_for_delivery');
      else if (activeFilter === 'completed') filteredOrders = state.orders.filter(o => o.status === 'completed' || o.status === 'delivered');
      else if (activeFilter === 'cancelled') filteredOrders = state.orders.filter(o => o.status === 'cancelled');

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-black text-slate-900 tracking-tight">Orders & Dispatch Controller</h1>
              <p class="text-xs text-slate-500 mt-0.5">Real-time status updates, delivery rider assignment, GST invoice generation, and stock reversal.</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="state.adminView='pos'; render();" class="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 text-xs font-bold shadow flex items-center gap-1.5">
                <i data-lucide="plus" class="h-4 w-4"></i>
                <span>Create Counter Bill</span>
              </button>
            </div>
          </div>

          <!-- Filter Tabs -->
          <div class="flex flex-wrap items-center gap-2 border-b border-slate-200 pb-3">

              { id: 'all', label: `All Orders (${state.orders.length})` },
              { id: 'delivery', label: 'Home Deliveries' },
              { id: 'in-store', label: 'Counter POS' },
              { id: 'out_for_delivery', label: 'Out for Delivery' },
              { id: 'completed', label: 'Completed' },
              { id: 'cancelled', label: 'Cancelled' }
            ].map(tab => `
              <button
                onclick="state.ordersFilter='${tab.id}'; render();"
                class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${activeFilter === tab.id ? 'bg-slate-900 text-white shadow-xs' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}"
              >
                ${tab.label}
              </button>
            `).join('')}
          </div>

          <!-- Orders Table -->
          <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-2xs space-y-4">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase tracking-wider text-slate-400">
                  <tr>
                    <th class="py-3 px-3">Invoice #</th>
                    <th class="py-3 px-3">Customer Details</th>
                    <th class="py-3 px-3">Fulfillment</th>
                    <th class="py-3 px-3">Order Status</th>
                    <th class="py-3 px-3">Courier Rider</th>
                    <th class="py-3 px-3">Total Amount</th>
                    <th class="py-3 px-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium">
                  ${filteredOrders.length === 0 ? `
                    <tr>
                      <td colspan="7" class="py-12 text-center text-slate-400">
                        <i data-lucide="receipt" class="h-8 w-8 mx-auto mb-2 opacity-30"></i>
                        <p>No orders matching "${activeFilter}" criteria.</p>
                      </td>
                    </tr>
                  ` : filteredOrders.map(ord => `
                    <tr class="hover:bg-slate-50/60">
                      <td class="py-3 px-3 font-mono font-bold text-slate-900">
                        ${ord.invoiceNumber}
                        <span class="block text-[10px] text-slate-400 font-sans font-normal">${ord.createdAt}</span>
                      </td>
                      <td class="py-3 px-3">
                        <p class="font-bold text-slate-900">${ord.customerName}</p>
                        <p class="text-[10px] text-slate-400">${ord.customerPhone}</p>
                      </td>
                      <td class="py-3 px-3 capitalize">
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${ord.orderType === 'delivery' ? 'bg-indigo-100 text-indigo-800' : 'bg-emerald-100 text-emerald-800'}">
                          ${ord.orderType}
                        </span>
                      </td>
                      <td class="py-3 px-3">
                        <select
                          onchange="setOrderStatus('${ord.id}', this.value);"
                          class="text-xs font-bold rounded-lg border border-slate-200 bg-white px-2 py-1 shadow-2xs"
                        >
                          ${['pending', 'confirmed', 'preparing', 'ready', 'out_for_delivery', 'delivered', 'completed', 'cancelled'].map(st => `
                            <option value="${st}" ${ord.status === st ? 'selected' : ''}>${st.replace('_', ' ').toUpperCase()}</option>
                          `).join('')}
                        </select>

                      <td class="py-3 px-3">
                        ${ord.deliveryPerson ? `

                        ` : `
                          ${ord.orderType === 'delivery' && ord.status !== 'cancelled' ? `
                            <button onclick="assignCourier('${ord.id}');" class="text-[10px] font-black text-indigo-700 bg-indigo-50 border border-indigo-200 px-2.5 py-1 rounded-lg hover:bg-indigo-100">

                      <td class="py-3 px-3 font-black text-slate-900 tabular-nums">${formatMoney(ord.grandTotal)}</td>
                      <td class="py-3 px-3 text-right space-x-1.5">

                          <i data-lucide="printer" class="h-4 w-4"></i>
                        </button>
                        ${ord.status !== 'cancelled' ? `
                          <button onclick="cancelOrder('${ord.id}');" class="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold" title="Cancel & Reverse Stock">
                            <i data-lucide="x" class="h-4 w-4"></i>
                          </button>
                        ` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

        return matchesSearch && matchesCat;

      const categories = ['All', 'Fruits & Vegetables', 'Dairy & Eggs', 'Grocery & Staples', 'Bakery & Bread', 'Beverages', 'Snacks & Sweets', 'Personal Care', 'Household & Cleaning'];

                      </td>
                      <td class="py-3 px-3">
                        ${p.stock <= 0 ? `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-100 text-rose-800">Out of Stock</span>
                        ` : p.stock <= p.minStock ? `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-100 text-amber-800 animate-pulse">Low Stock</span>
                        ` : `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Healthy</span>
                        `}
                      </td>
                      <td class="py-3 px-3 text-right space-x-1.5">
                        <button onclick="openEditProductModal('${p.id}');" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold" title="Edit Product">
                          <i data-lucide="edit-2" class="h-4 w-4"></i>
                        </button>
                        <button onclick="openStockAdjustModal('${p.id}');" class="p-1.5 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold" title="Adjust Stock">
                          <i data-lucide="boxes" class="h-4 w-4"></i>
                        </button>
                        <button onclick="deleteProduct('${p.id}');" class="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold" title="Delete Product">
                          <i data-lucide="trash-2" class="h-4 w-4"></i>
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Modal: Add or Edit Product

                </div>

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">SKU Code *</label>
                  <input type="text" required value="${p.sku}" oninput="state.editingProduct.sku=this.value;" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none focus:border-emerald-500" />
                </div>

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">Barcode / EAN</label>
                  <input type="text" value="${p.barcode}" oninput="state.editingProduct.barcode=this.value;" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-mono text-xs focus:outline-none focus:border-emerald-500" />
                </div>

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">Category *</label>
                  <select onchange="state.editingProduct.category=this.value;" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white font-bold">
                    ${categories.map(c => `
                      <option value="${c}" ${p.category === c ? 'selected' : ''}>${c}</option>

                  <select onchange="state.editingProduct.unit=this.value;" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white font-bold">
                    ${['kg', 'pack', 'bottle', 'can', 'box', 'piece'].map(u => `
                      <option value="${u}" ${p.unit === u ? 'selected' : ''}>${u}</option>

                </div>

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">Selling Price (${state.currency.symbol}) *</label>
                  <input type="number" step="0.01" required value="${p.price}" oninput="state.editingProduct.price=parseFloat(this.value)||0;" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-900" />
                </div>

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">Cost Basis Price (${state.currency.symbol}) *</label>
                  <input type="number" step="0.01" required value="${p.cost}" oninput="state.editingProduct.cost=parseFloat(this.value)||0;" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-900" />

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">Maximum Retail Price (MRP)</label>
                  <input type="number" step="0.01" value="${p.mrp}" oninput="state.editingProduct.mrp=parseFloat(this.value)||0;" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold" />

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">GST Tax Rate (%)</label>
                  <select onchange="state.editingProduct.tax=parseFloat(this.value)||0;" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white font-bold">

                <div>
                  <label class="block text-[11px] text-slate-500 mb-1">Current Stock Level *</label>

                      <img src="${p.image}" class="h-full w-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80'" />

                </div>

                  <label for="modalIsWeighed" class="text-xs font-medium text-slate-700">Weighed Item (Supports Decimal KG: 0.25kg, 0.5kg, 1.5kg)</label>

                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-700 shadow">Save Product</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // ==========================================
    // MODULE 4: INVENTORY VALUATION & AUDIT
    // ==========================================
    function renderInventoryView() {
      const totalCost = state.products.reduce((s, p) => s + (p.stock * p.cost), 0);
      const totalRetail = state.products.reduce((s, p) => s + (p.stock * p.price), 0);
      const margin = totalRetail > 0 ? Math.round(((totalRetail - totalCost) / totalRetail) * 100) : 0;
      const totalUnits = Math.round(state.products.reduce((s, p) => s + p.stock, 0));

      const filter = state.inventoryFilter || 'all';
      let filtered = state.products;
      if (filter === 'healthy') filtered = state.products.filter(p => p.stock > p.minStock);
      else if (filter === 'low') filtered = state.products.filter(p => p.stock > 0 && p.stock <= p.minStock);
      else if (filter === 'out') filtered = state.products.filter(p => p.stock <= 0);

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-black text-slate-900 tracking-tight">Inventory Valuation & Stock Management</h1>
              <p class="text-xs text-slate-500 mt-0.5">Real-time stock ledger, valuation at cost vs retail, and damage/waste adjustments.</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="openStockAdjustModal(state.products[0]?.id);" class="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 text-xs font-bold shadow flex items-center gap-1.5">
                <i data-lucide="sliders-horizontal" class="h-4 w-4"></i>
                <span>Adjust Stock Levels</span>
              </button>
            </div>
          </div>

          <!-- Valuation Metric Cards -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Inventory Cost Basis</span>
              <p class="text-2xl font-black text-slate-900 mt-1 tabular-nums">${formatMoney(totalCost)}</p>
              <span class="text-[11px] text-slate-500 font-bold">${totalUnits} Total Units</span>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Retail Market Value</span>
              <p class="text-2xl font-black text-emerald-700 mt-1 tabular-nums">${formatMoney(totalRetail)}</p>
              <span class="text-[11px] text-emerald-800 font-bold">${state.products.length} Active SKUs</span>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Expected Gross Margin</span>
              <p class="text-2xl font-black text-indigo-600 mt-1 tabular-nums">${margin}%</p>
              <span class="text-[11px] text-indigo-700 font-bold">Profit Potential: ${formatMoney(totalRetail - totalCost)}</span>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Stock Adjustments Logged</span>
              <p class="text-2xl font-black text-slate-900 mt-1 tabular-nums">${state.adjustments.length}</p>
              <span class="text-[11px] text-slate-500 font-bold">Audit History Active</span>
            </div>
          </div>

          <!-- Inventory Filter Tabs -->
          <div class="flex items-center gap-2 border-b border-slate-200 pb-3">
            ${[
              { id: 'all', label: `All Items (${state.products.length})` },
              { id: 'healthy', label: 'Healthy Stock' },
              { id: 'low', label: 'Low Stock' },
              { id: 'out', label: 'Out of Stock' }
            ].map(tab => `
              <button
                onclick="state.inventoryFilter='${tab.id}'; render();"
                class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition ${filter === tab.id ? 'bg-slate-900 text-white shadow-xs' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}"
              >
                ${tab.label}
              </button>
            `).join('')}
          </div>

          <!-- Inventory Table -->
          <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-2xs space-y-4">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase tracking-wider text-slate-400">
                  <tr>
                    <th class="py-3 px-3">Product Name</th>
                    <th class="py-3 px-3">SKU</th>
                    <th class="py-3 px-3">Category</th>
                    <th class="py-3 px-3">Stock Balance</th>
                    <th class="py-3 px-3">Cost Basis</th>
                    <th class="py-3 px-3">Total Value</th>
                    <th class="py-3 px-3">Status</th>
                    <th class="py-3 px-3 text-right">Stock Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium">
                  ${filtered.map(p => `
                    <tr class="hover:bg-slate-50/60">
                      <td class="py-3 px-3 flex items-center gap-2.5">
                        <img src="${p.image}" class="h-8 w-8 rounded-lg object-cover shrink-0 border" alt="${p.name}" />
                        <span class="font-bold text-slate-900">${p.name}</span>
                      </td>
                      <td class="py-3 px-3 font-mono text-[11px] text-slate-500">${p.sku}</td>
                      <td class="py-3 px-3">${p.category}</td>
                      <td class="py-3 px-3 font-bold text-slate-900 tabular-nums">
                        ${p.stock} ${p.unit}
                        <div class="w-24 bg-slate-100 rounded-full h-1.5 mt-1 overflow-hidden">
                          <div class="h-1.5 rounded-full ${p.stock <= p.minStock ? 'bg-rose-500' : 'bg-emerald-500'}" style="width: ${Math.min(100, Math.round((p.stock / (p.minStock * 2 || 20)) * 100))}%"></div>
                        </div>
                      </td>
                      <td class="py-3 px-3 tabular-nums">${formatMoney(p.cost)}</td>
                      <td class="py-3 px-3 font-black text-slate-900 tabular-nums">${formatMoney(p.stock * p.cost)}</td>
                      <td class="py-3 px-3">
                        ${p.stock <= 0 ? `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-rose-100 text-rose-800">Out of Stock</span>
                        ` : p.stock <= p.minStock ? `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-amber-100 text-amber-800 animate-pulse">Low Stock</span>
                        ` : `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Healthy</span>
                        `}
                      </td>
                      <td class="py-3 px-3 text-right">
                        <button onclick="openStockAdjustModal('${p.id}');" class="px-3 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs">
                          Adjust
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Stock Adjustment Audit Log -->
          <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-2xs space-y-4">
            <h3 class="text-sm font-black text-slate-900">Stock Mutation & Audit History</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b border-slate-100 text-[10px] font-black uppercase tracking-wider text-slate-400">
                  <tr>
                    <th class="py-2.5 px-3">Timestamp</th>
                    <th class="py-2.5 px-3">Product</th>
                    <th class="py-2.5 px-3">Type</th>
                    <th class="py-2.5 px-3">Quantity Delta</th>
                    <th class="py-2.5 px-3">Reason / Reference</th>
                    <th class="py-2.5 px-3">Auditor</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium">
                  ${state.adjustments.slice(0, 8).map(adj => `
                    <tr class="hover:bg-slate-50/60">
                      <td class="py-2.5 px-3 text-slate-400">${adj.time}</td>
                      <td class="py-2.5 px-3 font-bold text-slate-900">${adj.product}</td>
                      <td class="py-2.5 px-3 uppercase text-[10px] font-black">
                        <span class="px-2 py-0.5 rounded-full ${adj.type === 'add' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                          ${adj.type}
                        </span>
                      </td>
                      <td class="py-2.5 px-3 font-mono font-bold ${adj.type === 'add' ? 'text-emerald-700' : 'text-rose-700'}">
                        ${adj.type === 'add' ? '+' : '-'}${adj.qty}
                      </td>
                      <td class="py-2.5 px-3 text-slate-600">${adj.reason}</td>
                      <td class="py-2.5 px-3 text-slate-500 font-bold">${adj.user}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    // Modal: Stock Adjustment
    function renderStockAdjustModal() {
      if (!state.showAdjustModal || !state.adjustModalProduct) return '';
      const prod = state.adjustModalProduct;

      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
          <div class="relative w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 class="text-base font-black text-slate-900">Adjust Inventory Stock</h3>
                <p class="text-xs text-slate-400">${prod.name} (Current: ${prod.stock} ${prod.unit})</p>
              </div>
              <button onclick="closeStockAdjustModal();" class="p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-700">✕</button>
            </div>

            <form onsubmit="handleStockAdjustSubmit(event);" class="space-y-4 text-xs font-semibold text-slate-700">
              <div>
                <label class="block text-[11px] text-slate-500 mb-1">Adjustment Action *</label>
                <select name="type" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs bg-white font-bold">
                  <option value="add">Inward Restock / Shipment (+)</option>
                  <option value="damage">Damaged / Broken Packaging (-)</option>
                  <option value="expired">Expired Perishable Goods (-)</option>
                  <option value="correction">Audit Inventory Physical Count (=)</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] text-slate-500 mb-1">Quantity (${prod.unit}) *</label>
                <input type="number" name="quantity" step="0.1" min="0.1" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-bold text-slate-900" placeholder="e.g. 10" />
              </div>

              <div>
                <label class="block text-[11px] text-slate-500 mb-1">Audit Reason / Invoice Reference *</label>
                <input type="text" name="reason" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" placeholder="e.g. Supplier PO Received or Shelf Transit Loss" />
              </div>

              <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="closeStockAdjustModal();" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold hover:bg-emerald-700 shadow">Save Adjustment</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // ==========================================
    // MODULE 5: LOW STOCK ALERTS VIEW
    // ==========================================
    function renderStockAlertsView() {
      const outOfStock = state.products.filter(p => p.stock <= 0);
      const lowStock = state.products.filter(p => p.stock > 0 && p.stock <= p.minStock);

      const filter = state.alertsFilter || 'all';
      let displayed = [];
      if (filter === 'out') displayed = outOfStock;
      else if (filter === 'low') displayed = lowStock;
      else displayed = [...outOfStock, ...lowStock];

      return `
        <div class="space-y-6 animate-fade-in">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 class="text-2xl font-black text-slate-900 tracking-tight">Low-Stock & Replenishment Controller</h1>
              <p class="text-xs text-slate-500 mt-0.5">Automated reorder triggers dynamically calculated from live inventory and minimum stock thresholds.</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="state.adminView='inventory'; render();" class="rounded-xl bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 text-xs font-bold shadow flex items-center gap-1.5">
                <i data-lucide="boxes" class="h-4 w-4"></i>
                <span>Open Inventory Valuation</span>
              </button>
            </div>
          </div>

          <!-- Alert Metric Cards -->
          <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <div class="rounded-2xl border border-rose-200 bg-rose-50/50 p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-rose-600 uppercase tracking-wider">Critical: Out of Stock</span>
              <p class="text-3xl font-black text-rose-700 mt-1 tabular-nums">${outOfStock.length}</p>
              <span class="text-[11px] text-rose-600 font-bold">Needs Immediate Restock</span>
            </div>

            <div class="rounded-2xl border border-amber-200 bg-amber-50/50 p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-amber-600 uppercase tracking-wider">Warning: Below Minimum</span>
              <p class="text-3xl font-black text-amber-700 mt-1 tabular-nums">${lowStock.length}</p>
              <span class="text-[11px] text-amber-700 font-bold">Approaching Stockout</span>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-2xs">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Healthy Stock SKUs</span>
              <p class="text-3xl font-black text-emerald-600 mt-1 tabular-nums">${state.products.length - outOfStock.length - lowStock.length}</p>
              <span class="text-[11px] text-emerald-700 font-bold">In-Stock Operational</span>
            </div>
          </div>

          <!-- Alert Filter Tabs -->
          <div class="flex items-center gap-2 border-b border-slate-200 pb-3">
            ${[
              { id: 'all', label: `All Alerts (${outOfStock.length + lowStock.length})` },
              { id: 'out', label: `Out of Stock (${outOfStock.length})` },
              { id: 'low', label: `Low Stock (${lowStock.length})` }
            ].map(tab => `

    function renderPOSView() {

      const posTax = Math.round((posSubtotal * (state.gstRate / 100)) * 100) / 100;
      const posGrandTotal = Math.round((posSubtotal + posTax - (state.orderDiscount || 0)) * 100) / 100;

      const search = (state.posSearch || '').toLowerCase();
      const cat = state.posCategory || 'All';

      const filteredProducts = state.products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(search) || p.sku.toLowerCase().includes(search) || p.barcode.includes(search);
        const matchesCat = cat === 'All' || p.category === cat;
        return matchesSearch && matchesCat;
      });

      const categories = ['All', 'Fruits & Vegetables', 'Dairy & Eggs', 'Grocery & Staples', 'Bakery & Bread', 'Beverages', 'Snacks & Sweets', 'Personal Care', 'Household & Cleaning'];

    // ==========================================
    // AUTHENTICATED ACCOUNT ACTIONS (PHASE 6.3)
    // ==========================================
    async function handleSwitchAccount() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      state.user = null;
      state.experience = 'login';
      state.toast = { msg: 'Logged out. Please select your account or role.' };
      render();
      setTimeout(() => {
        state.toast = null;
        render();
      }, 3000);
    }

    async function handleLogout() {
      try {
        await fetch('/api/auth/logout', { method: 'POST' });
      } catch (e) {}
      state.user = null;
      state.experience = 'storefront';
      state.storefrontPage = 'home';
      state.toast = { msg: 'Successfully logged out. Welcome back to Avani Grocers!' };
      render();
      setTimeout(() => {
        state.toast = null;
        render();
      }, 3000);
    }

    // ==========================================
    // GLOBAL ROUTE SCROLL HANDLER (PHASE 6.2)
    // ==========================================
    let prevRouteKey = '';
    function handleRouteScroll() {
      const currentRouteKey = `${state.experience}:${state.storefrontPage}:${state.adminView}`;
      if (prevRouteKey && prevRouteKey !== currentRouteKey) {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        const mainEl = document.querySelector('main');
        if (mainEl && state.adminView !== 'pos') {
          mainEl.scrollTop = 0;
        }
      }
      prevRouteKey = currentRouteKey;
    }

    // ==========================================
    // MAIN APP RENDER ROUTER
    // ==========================================
    function render() {
      handleRouteScroll();
      const app = document.getElementById('app');

      let viewHtml = '';

      if (state.experience === 'login') {
        viewHtml = renderRoleLogin();
      } else if (state.experience === 'cashier') {
        viewHtml = `
          ${renderEcosystemSwitcher()}
          ${renderPOSView()}
        `;
      } else if (state.experience === 'admin') {
        let adminContent = '';
        if (state.adminView === 'pos') adminContent = renderPOSView();
        else if (state.adminView === 'orders') adminContent = renderOrdersView();
        else if (state.adminView === 'products') adminContent = renderProductsView();
        else if (state.adminView === 'inventory') adminContent = renderInventoryView();
        else if (state.adminView === 'alerts') adminContent = renderStockAlertsView();
        else if (state.adminView === 'settings') adminContent = renderSettingsView();
        else adminContent = renderAdminDashboard();

        viewHtml = `
          ${renderEcosystemSwitcher()}
          <div class="flex min-h-screen bg-slate-50">
            ${renderAdminSidebar()}
            <main class="flex-1 p-6 overflow-y-auto">
              <div class="max-w-7xl mx-auto">
                ${adminContent}
              </div>
            </main>
          </div>
          ${renderProductModal()}
          ${renderStockAdjustModal()}
        `;
      } else {
        // Customer Storefront
        let pageContent = '';
        if (state.storefrontPage === 'home') pageContent = renderStorefrontHome();
        else if (state.storefrontPage === 'shop') pageContent = renderStorefrontShop();
        else if (state.storefrontPage === 'cart') pageContent = renderStorefrontCart();
        else if (state.storefrontPage === 'checkout') pageContent = renderStorefrontCheckout();
        else if (state.storefrontPage === 'confirmation') pageContent = renderStorefrontConfirmation();
        else if (state.storefrontPage === 'tracking') pageContent = renderStorefrontTracking();
        else if (state.storefrontPage === 'account') pageContent = renderStorefrontAccount();
        else if (state.storefrontPage === 'wishlist') pageContent = renderStorefrontWishlist();
        else pageContent = renderStorefrontHome();

        viewHtml = `
          ${renderStorefrontHeader()}
          <main class="min-h-screen bg-slate-50">
            ${pageContent}
          </main>
          ${renderStorefrontFooter()}
        `;
      }

      app.innerHTML = `
        ${viewHtml}
        ${renderInvoiceModal()}
        ${state.toast ? `
          <div class="fixed bottom-5 right-5 z-50 flex items-center gap-2 rounded-2xl bg-slate-900 px-4 py-3 text-xs font-bold text-white shadow-2xl animate-bounce">
            <span>${state.toast.msg}</span>
          </div>
        ` : ''}
      `;

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Default entry: Start in Customer Storefront Home
    render();
  </script>
</body>
</html>
